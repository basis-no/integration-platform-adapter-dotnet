name: Publish NuGet pre-release

# Manually publishes the checked-out commit to NuGet.org as a pre-release of
# the csproj's next intended version: X.Y.Z-preview.<UTC date>.<run number>.
# It does not create a Git tag or a release version; final releases stay
# tag-driven in publish-nuget.yml. NuGet.org never deletes a version (unlisting
# only hides it), so every run publishes permanently.
#
# Trust boundaries, one per job, as in publish-nuget.yml:
# - build runs the project code (tests, pack) with no secrets and no OIDC token.
# - attest runs no project code. It records the package checksum and requests
#   an OIDC token only for GitHub build provenance.
# - push runs in environment `prerelease` (required reviewers), never checks
#   out or runs project code, verifies the package against the recorded
#   checksum and provenance, and is the only job whose OIDC token is exchanged
#   for a NuGet.org key. The nuget.org Trusted Publishing policy for this file
#   is bound to `prerelease`.

on:
  workflow_dispatch:

concurrency:
  group: publish-dotnet-adapter-prerelease
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    # Runs only on github.com, never on a mirror, as publish-nuget.yml.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    # The same real-Postgres suite as test.yml, before anything is published.
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: adapter_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adapter_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      POSTGRES_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=adapter_test;Username=postgres;Password=synthetic-ci-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PROJECT: src/Basis.IntegrationPlatform.MessageStore/Basis.IntegrationPlatform.MessageStore.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Choose the pre-release version
        id: version
        run: |
          development="$(dotnet msbuild "$PROJECT" -getProperty:Version)"
          if [[ ! "$development" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-[0-9A-Za-z.-]+$ ]]; then
            echo "Refusing: the csproj Version '$development' is not a development version such as 0.4.0-preview.1." >&2
            exit 1
          fi
          next="${BASH_REMATCH[1]}"
          released="$(curl -fsS --retry 3 https://api.nuget.org/v3-flatcontainer/basis.integrationplatform.messagestore/index.json)"
          if jq -e --arg v "$next" '.versions | index($v) != null' <<<"$released" >/dev/null; then
            echo "Refusing: $next is already released; set the csproj Version to the next intended release." >&2
            exit 1
          fi
          # SemVer forbids leading zeros in numeric labels, which rules out a time
          # of day such as 090503; the run number keeps each version unique.
          version="$next-preview.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packing $version from $GITHUB_SHA ($GITHUB_REF_NAME)"

      - name: Install the synthetic contract fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for sql in tests/fixtures/postgres/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d adapter_test --set=ON_ERROR_STOP=1 < "$sql"
          done

      - name: Test with real PostgreSQL
        run: dotnet test tests/Basis.IntegrationPlatform.MessageStore.Tests/Basis.IntegrationPlatform.MessageStore.Tests.csproj --configuration Release

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack "$PROJECT" --configuration Release -p:Version="$VERSION" --output package

      - name: Retain the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-prerelease-package
          path: package/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PACKAGE: Basis.IntegrationPlatform.MessageStore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-prerelease-package
          path: package
      - name: Record the package checksum (data only, no checkout)
        working-directory: package
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]{8}\.[1-9][0-9]*$ ]] || { echo "Unexpected version '$VERSION'." >&2; exit 1; }
          # Exactly the one package, as a regular file.
          name="$PACKAGE.$VERSION.nupkg"
          test "$(find . -mindepth 1 -printf '%y %P\n')" = "f $name"
          sha256sum -- "$name" > "$GITHUB_WORKSPACE/package.sha256"
          { echo '```'; cat "$GITHUB_WORKSPACE/package.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: package.sha256
      - name: Retain the recorded checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-prerelease-checksums
          path: package.sha256
          if-no-files-found: error
          retention-days: 30

  push:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # nuget.org Trusted Publishing policy: this workflow file and environment
    # `prerelease` only. A reviewer approves before the job gets its token.
    environment: prerelease
    permissions:
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      PACKAGE: Basis.IntegrationPlatform.MessageStore
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check environment protection
        run: |
          # Fail closed if the environment lost its required reviewers.
          gh api "repos/$GITHUB_REPOSITORY/environments/prerelease" | jq -e '
            .can_admins_bypass == false
            and ([.protection_rules[] | select(.type == "required_reviewers")
                  | select(.prevent_self_review == true)] | length) == 1' > /dev/null \
            || { echo "Environment prerelease is not protected as required." >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-prerelease-package
          path: package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-prerelease-checksums
          path: checksums
      - name: Verify package bytes and build provenance (data only)
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]{8}\.[1-9][0-9]*$ ]] || { echo "Unexpected version '$VERSION'." >&2; exit 1; }
          test "$(find package -mindepth 1 -printf '%y %P\n')" = "f $PACKAGE.$VERSION.nupkg"
          test "$(wc -l < checksums/package.sha256)" -eq 1
          (cd package && sha256sum -c --strict --quiet ../checksums/package.sha256)
          gh attestation verify "package/$PACKAGE.$VERSION.nupkg" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-prerelease.yml" \
            --signer-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners > /dev/null
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Requested right before the push: the exchanged API key lives 1 hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: a version that already exists must fail the run,
      # never pass while NuGet.org keeps other bytes under that version.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "package/$PACKAGE.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Summary
        run: |
          {
            echo "Published \`$PACKAGE\` \`$VERSION\` from \`$GITHUB_SHA\` ($GITHUB_REF_NAME)."
            echo
            echo "Pin it exactly, for example in \`Directory.Packages.props\`:"
            echo
            echo '```xml'
            echo "<PackageVersion Include=\"$PACKAGE\" Version=\"$VERSION\" />"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
