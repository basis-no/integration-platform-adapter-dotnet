name: Publish to NuGet.org

# Tag-driven release per ADR-003: the csproj keeps a -preview version for
# development; the release version derives from the tag (vX.Y.Z). Publishes
# with NuGet Trusted Publishing (OIDC via NuGet/login); the only secret is
# NUGET_USER, the nuget.org profile name.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: the job proves its identity to nuget.org via the
      # GitHub OIDC token and gets a 1-hour API key back - no stored secret.
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a release tag (vX.Y.Z); refusing to publish." >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test
        # No solution file at the repo root - target the test project directly.
        run: dotnet test tests/Basis.IntegrationPlatform.MessageStore.Tests/Basis.IntegrationPlatform.MessageStore.Tests.csproj --configuration Release

      - name: Pack
        run: dotnet pack src/Basis.IntegrationPlatform.MessageStore/Basis.IntegrationPlatform.MessageStore.csproj --configuration Release -p:Version="${TAG#v}" --output artifacts

      # Requested right before the push: the exchanged API key lives 1 hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
